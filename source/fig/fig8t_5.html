<meta charset="utf-8">
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="800" height="478" viewBox="0 0 800 478" style="background:#fff"></svg>
<style>body{margin:0}</style>
<script src="chem.js"></script><script src="fig8t_haw.js"></script>
<script>
init('s',18);
const R=7, S=19;
function hex(x,y,fill){const p=[];for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;p.push((x+R*Math.cos(a)).toFixed(1)+','+(y+R*Math.sin(a)).toFixed(1));}el('polygon',{points:p.join(' '),fill:fill||'#dfe8f6',stroke:'#2f5496','stroke-width':1.3});}
function row(x,y,n,dx,dy,fill){const pts=[];for(let i=0;i<n;i++){pts.push([x+i*dx,y+i*dy]);}
  for(let i=0;i<n-1;i++)line(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],{color:'#2f5496',w:1.4});
  pts.forEach(p=>hex(p[0],p[1],fill)); return pts;}
function title(x,y,t,sub){label(x,y,t,{fs:18,bold:true}); label(x,y+20,sub,{fs:14,italic:true,color:'#444'});}
// amylose
row(30,130,18,S,0); title(200,40,'Amylose','unbranched chain; α-1,4 bonds only');
// amylopectin
const m=row(430,175,18,S,0);
[[2,6],[10,7]].forEach(([k,n])=>{const b=[m[k][0]+8,m[k][1]-19]; line(m[k][0],m[k][1],b[0],b[1],{color:RED,w:2}); row(b[0],b[1],n,S*0.92,-S*0.42);});
hex(m[2][0],m[2][1],'#f7d9d4'); hex(m[10][0],m[10][1],'#f7d9d4');
title(600,40,'Amylopectin','α-1,4 chains with an α-1,6 branch about every 25 units');
// glycogen
const g=row(50,362,15,S,0);
[[1,-1],[4,1],[7,-1],[10,1],[13,-1]].forEach(([k,sg])=>{ const p=g[k]; const b0=[p[0]+8,p[1]+sg*19]; line(p[0],p[1],b0[0],b0[1],{color:RED,w:2});
  const br=row(b0[0],b0[1],3,S*0.85,sg*S*0.5); hex(p[0],p[1],'#f7d9d4');
  const q=br[1]; const s0=[q[0]-7,q[1]+sg*19]; line(q[0],q[1],s0[0],s0[1],{color:RED,w:2}); row(s0[0],s0[1],2,-S*0.3,sg*S*0.95); hex(q[0],q[1],'#f7d9d4');});
title(200,230,'Glycogen','like amylopectin, but branched about every 10–15 units');
// cellulose: parallel chains + H bonds
const rows=[0,1,2].map(i=>row(430,320+i*40,18,S,0,'#e3f1e3'));
for(let i=0;i<2;i++)for(let k=1;k<18;k+=2)line(rows[i][k][0],rows[i][k][1]+R+2,rows[i+1][k][0],rows[i+1][k][1]-R-2,{color:GRN,w:1.3,dash:'2,3'});
title(600,230,'Cellulose','straight β-1,4 chains held side by side by hydrogen bonds');
label(600,462,'green dotted lines = hydrogen bonds between chains',{fs:13,color:GRN});
label(200,462,'red = α-1,6 branch points',{fs:13,color:RED});
line(400,15,400,468,{color:'#ccc',w:1,dash:'4,4'}); line(15,200,785,200,{color:'#ccc',w:1,dash:'4,4'});
</script>
