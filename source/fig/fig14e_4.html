<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" style="background:#fff"></svg>
<style>body{margin:0}</style>
<script src="chem.js"></script>
<script>
init('s',18);
const C=['#1c2140','#3a5fb0','#9c4f2e','#dcae4e'];
// (a) spot plate
label(250,28,'(a) Spot plate for Part A (example results)',{fs:19,bold:true});
rect(60,50,410,320,{fill:'#f4f4f4',stroke:'#888',rx:18,sw:2});
const tubes=['Tube 1','Tube 2','Tube 3','Tube 4'], times=['0 min','5 min','10 min'];
const res=[[0,0,0,0],[0,1,2,3],[0,2,3,3]];
tubes.forEach((t,j)=>label(195+j*80,82,t,{fs:16,bold:true}));
times.forEach((t,i)=>{txt(72,145+i*95,t,{fs:16,bold:true});
  tubes.forEach((_,j)=>{const cx=195+j*80,cy=140+i*95; el('circle',{cx,cy,r:30,fill:'#fff',stroke:'#999','stroke-width':2}); el('circle',{cx,cy,r:22,fill:C[res[i][j]],stroke:'none'}); label(cx,cy+48,'',{});});});
label(265,392,'4 drops of reaction mixture + 1 drop of iodine reagent per well',{fs:15,color:'#333'});
// (b) scale
label(760,28,'(b) Reading the iodine test',{fs:19,bold:true});
const rows=[['Blue-black','All starch left','0 (none)'],['Blue','Most starch left','1 (low)'],['Red-brown','Some left (dextrins)','2 (moderate)'],['Yellow-brown','No starch left','3 (high)']];
label(600,72,'Color',{fs:16,bold:true}); label(790,72,'Starch remaining',{fs:16,bold:true}); label(935,72,'Activity',{fs:16,bold:true});
rows.forEach((r,i)=>{const y=110+i*70; el('circle',{cx:560,cy:y,r:20,fill:C[i],stroke:'#999','stroke-width':1.5});
  txt(588,y+6,r[0],{fs:16}); txt(718,y+6,r[1],{fs:15}); label(935,y+6,r[2],{fs:16,bold:true});});
txt(540,385,'Yellow-brown is the color of the iodine reagent itself.',{fs:15,color:'#333'});
</script>
