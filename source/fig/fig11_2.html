<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1040" height="172" viewBox="0 0 1040 172" style="background:#fff"></svg>
<style>body{margin:0}</style>
<script src="chem.js"></script>
<script>
init('s',19); const RED='#c0392b', BLUE='#1f5fbf'; const y=90;
const d=chain(10,y,[{l:'H_2N'},{l:'C',up:{l:'H'},down:{l:'H'}},{l:'C',up:{l:'O',order:2}},{l:'N',down:{l:'H'},bondColor:BLUE},{l:'C',up:{l:'CH_3'},down:{l:'H'}},{l:'C',up:{l:'O',order:2}},{l:'OH'}]);
label((d.start+d.end)/2,158,'glycylalanine (Gly–Ala), a dipeptide',{fs:16});
txt(d.end+10,y+7,'+'); const w=txt(d.end+34,y+7,'H_2O',{color:RED});
const ax1=d.end+34+w.w+12, ax2=ax1+110; arrow(ax1,y,ax2,y);
label((ax1+ax2)/2,y-14,'H^+ or enzyme',{fs:14});
label((ax1+ax2)/2,y+26,'hydrolysis',{fs:15,italic:true});
const g=chain(ax2+12,y,[{l:'H_2N'},{l:'C',up:{l:'H'},down:{l:'H'}},{l:'C',up:{l:'O',order:2}},{l:'OH'}]);
label((g.start+g.end)/2,158,'glycine (Gly)',{fs:16});
txt(g.end+10,y+7,'+');
const a=chain(g.end+34,y,[{l:'H_2N'},{l:'C',up:{l:'CH_3'},down:{l:'H'}},{l:'C',up:{l:'O',order:2}},{l:'OH'}]);
label((a.start+a.end)/2,158,'alanine (Ala)',{fs:16});
</script>
