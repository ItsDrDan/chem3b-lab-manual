<meta charset="utf-8">
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560" style="background:#fff"></svg>
<style>body{margin:0}</style>
<script src="chem.js"></script>
<script>
init('s',19); const BLU='#1f5fbf', RED='#c0392b', GR='#1e8449'; const U=44, SL=40;
// Haworth pyranose: vertices (standard): C4 left, C5 back-left, O back-right, C1 right, C2 front-right, C3 front-left
function pyran(cx,cy,subs){
  const P={C4:[-1.3,0],C5:[-0.6,-0.62],O:[0.6,-0.62],C1:[1.3,0],C2:[0.6,0.58],C3:[-0.6,0.58]};
  const pt=k=>[cx+P[k][0]*U,cy+P[k][1]*U];
  return ring(P,pt,['C4','C5','O','C1','C2','C3'],[['C1','C2'],['C2','C3'],['C3','C4']],subs);
}
// Haworth furanose drawn flipped (as in sucrose): O top, C2 left, C3 front-left, C4 front-right, C5 right
function furanFlip(cx,cy,subs){
  const P={O:[0,-0.78],C2:[-1.1,-0.12],C3:[-0.65,0.62],C4:[0.65,0.62],C5:[1.1,-0.12]};
  const pt=k=>[cx+P[k][0]*U,cy+P[k][1]*U];
  return ring(P,pt,['O','C5','C4','C3','C2'],[['C2','C3'],['C3','C4'],['C4','C5']],subs);
}
function ring(P,pt,order,thick,subs){
  const isThick=(a,b)=>thick.some(([p,q])=>(p==a&&q==b)||(p==b&&q==a));
  for(let i=0;i<order.length;i++){const a=order[i],b=order[(i+1)%order.length];let [x1,y1]=pt(a),[x2,y2]=pt(b);
    // shorten bonds at the O label
    const sh=(xa,ya,xb,yb)=>{const L=Math.hypot(xb-xa,yb-ya);return [xa+(xb-xa)*11/L,ya+(yb-ya)*11/L];};
    if(a=='O')[x1,y1]=sh(x1,y1,x2,y2); if(b=='O')[x2,y2]=sh(x2,y2,x1,y1);
    line(x1,y1,x2,y2,{w:isThick(a,b)?5.5:1.8});}
  const [ox,oy]=pt('O'); atomAt(ox,oy,'O');
  const out={};
  for(const k in subs){const [x,y]=pt(k); out[k]=[x,y];
    const s=subs[k];
    ['up','down'].forEach(d=>{ if(!s[d])return; const v=s[d]; const lab=typeof v=='string'?v:v.l; const len=(typeof v=='object'&&v.len)||SL;
      const col=typeof v=='object'?v.c:undefined; const yy=d=='up'?y-len:y+len;
      if(lab==='-'){line(x,y,x,yy,{color:col});return;}
      line(x,y,x,yy+(d=='up'?10:-10),{color:col}); atomAt(x+(typeof v=='object'&&v.dx||0),d=='up'?yy:yy+2,lab,{color:col});});
  }
  return out;
}
const glcLeft={C1:{down:{l:'-',c:RED,len:36}},C2:{down:'OH'},C3:{up:{l:'OH',len:26}},C4:{down:'HO'},C5:{up:{l:'CH_2OH',dx:0}}};
// ---- Maltose
const y1=140;
const a=pyran(150,y1,glcLeft);
const b=pyran(470,y1,{C1:{down:{l:'OH',c:BLU}},C2:{down:'OH'},C3:{up:{l:'OH',len:26}},C4:{down:{l:'-',c:RED,len:36}},C5:{up:'CH_2OH'}});
// glycosidic O between a.C1 and b.C4 (below)
{const [x1,yy]=a.C1,[x2]=b.C4; const ox=(x1+x2)/2, oy=yy+60; line(x1,yy+36,ox-8,oy-6,{color:RED}); line(ox+8,oy-6,x2,yy+36,{color:RED}); atomAt(ox,oy,'O',{color:RED});
 label(ox,oy+34,'α(1→4) glycosidic bond',{fs:15,color:RED});}
// circle the free OH
{const [x,y]=b.C1; el('ellipse',{cx:x,cy:y+SL+2,rx:24,ry:17,fill:'none',stroke:BLU,'stroke-width':2}); label(x+70,y+SL+40,'free hemiacetal –OH',{fs:15,color:BLU}); label(x+70,y+SL+58,'(ring can open)',{fs:15,color:BLU});}
label(70,30,'Maltose',{fs:21,bold:true}); label(670,30,'Reducing sugar',{fs:17,bold:true,color:BLU});
label(a.C1[0]+10,a.C1[1]-8,'1',{fs:13,color:'#777'}); label(b.C4[0]-12,b.C4[1]-8,'4',{fs:13,color:'#777'}); label(b.C1[0]+12,b.C1[1]-8,'1',{fs:13,color:'#777'});
// divider
line(20,285,760,285,{color:'#bbb',w:1,dash:'5,5'});
// ---- Sucrose
const y2=410;
const c=pyran(150,y2,glcLeft);
const d=furanFlip(450,y2,{C2:{down:{l:'-',c:RED,len:36},up:{l:'HOH_2C'}},C3:{down:'OH'},C4:{up:{l:'HO',len:26,dx:-14}},C5:{down:{l:'CH_2OH',dx:12}}});
{const [x1,yy]=c.C1,[x2,y22]=d.C2; const ox=(x1+x2)/2, oy=yy+64; line(x1,yy+36,ox-8,oy-6,{color:RED}); line(ox+8,oy-6,x2,y22+36,{color:RED}); atomAt(ox,oy,'O',{color:RED});
 label(ox,oy+34,'α,β(1→2) glycosidic bond',{fs:15,color:RED});}
label(c.C1[0]+10,c.C1[1]-8,'1',{fs:13,color:'#777'}); label(d.C2[0]-12,d.C2[1]-8,'2',{fs:13,color:'#777'});
label(70,300,'Sucrose',{fs:21,bold:true}); label(670,300,'Nonreducing sugar',{fs:17,bold:true,color:RED});
label(150,y2+120,'glucose unit',{fs:15,italic:true,color:'#444'}); label(450,y2+120,'fructose unit',{fs:15,italic:true,color:'#444'});
label(150,y1+120,'glucose unit',{fs:15,italic:true,color:'#444'}); label(470,y1+120,'glucose unit',{fs:15,italic:true,color:'#444'});
label(660,y2-10,'Both anomeric carbons',{fs:15,color:RED}); label(660,y2+10,'(glucose C1 and fructose C2)',{fs:15,color:RED}); label(660,y2+30,'are tied up in the bond:',{fs:15,color:RED}); label(660,y2+50,'no ring can open',{fs:15,color:RED});
</script>
