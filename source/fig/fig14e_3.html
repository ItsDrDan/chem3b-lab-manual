<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" style="background:#fff"></svg>
<style>body{margin:0}</style>
<script src="chem.js"></script>
<script>
init('s',18);
function panel(ox,title,xmin,xmax,ticks,xlab,f,opt,optLab,notes){
  const W=380,H=260,x0=ox+70,y0=330;
  const X=v=>x0+(v-xmin)/(xmax-xmin)*W, Y=a=>y0-a*H;
  label(x0+W/2,30,title,{fs:20,bold:true});
  arrow(x0,y0,x0,y0-H-25,{w:2}); arrow(x0,y0,x0+W+20,y0,{w:2});
  ticks.forEach(t=>{line(X(t),y0,X(t),y0+6,{w:1.5}); label(X(t),y0+24,String(t),{fs:16});});
  label(x0+W/2,y0+56,xlab,{fs:19,bold:true});
  const tl=txt(0,0,'Enzyme activity',{fs:19,bold:true}); tl.el.setAttribute('transform',`translate(${x0-22},${y0-H/2+70}) rotate(-90)`);
  let d=''; for(let v=xmin;v<=xmax+1e-9;v+=(xmax-xmin)/300){const a=f(v); d+=(d?'L':'M')+X(v).toFixed(1)+','+Y(a).toFixed(1);}
  el('path',{d,fill:'none',stroke:'#1f5fbf','stroke-width':4.5});
  line(X(opt),Y(f(opt)),X(opt),y0,{w:1.3,dash:'5 4',color:'#555'});
  label(X(opt),Y(f(opt))-14,optLab,{fs:16});
  notes.forEach(([x,y,s,c])=>txt(x,y,s,{fs:15,color:c||'#333'}));
}
// temperature: rise ~ exponential-ish to 37, fall to 0 by ~65
const fT=t=>t<=37?0.08+0.92*Math.exp(-Math.pow((37-t)/17,2)):Math.exp(-Math.pow((t-37)/14,2));
panel(0,'Effect of temperature',0,100,[0,20,40,60,80,100],'Temperature (°C)',fT,37,'Optimum ≈ 37 °C',
 [[78,112,'Cold: slow,',''],[78,130,'not destroyed',''],[300,250,'Hot: the enzyme',''+'#c0392b'],[300,268,'is denatured','#c0392b']]);
// pH: gaussian centered 6.8
const fP=p=>Math.exp(-Math.pow((p-6.8)/1.25,2));
panel(500,'Effect of pH',0,14,[0,2,4,6,8,10,12,14],'pH',fP,6.8,'Optimum ≈ pH 6.8',
 [[575,220,'Too acidic:','#c0392b'],[575,238,'R-group charges','#c0392b'],[575,256,'change; enzyme','#c0392b'],[575,274,'unfolds','#c0392b'],[840,220,'Too basic:','#c0392b'],[840,238,'same effect','#c0392b']]);
</script>
