<meta charset="utf-8">
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="640" height="385" viewBox="0 0 640 385" style="background:#fff"></svg>
<style>body{margin:0}</style>
<script src="chem.js"></script>
<script>
init('s',18); const LIQ='#f3e3b3', GL='#333', RED='#c0392b', BUB='#a08850';
function shapes(ox){const ax=ox+190,aw=28,atop=40,abot=262,bx=ox+100,by=232,br=52;
  return {ax,aw,atop,abot,bx,by,br,list:[
    ['path',{d:`M${ax} ${abot+20} L${ax} ${atop+aw/2} A${aw/2} ${aw/2} 0 0 1 ${ax+aw} ${atop+aw/2} L${ax+aw} ${abot+20} Z`}],
    ['rect',{x:bx,y:abot-8,width:ax+aw-bx,height:28}],
    ['circle',{cx:bx,cy:by,r:br}],
    ['rect',{x:bx-13,y:by-br-30,width:26,height:40}]]};}
function tube(ox,gas){
  const S=shapes(ox);
  S.list.forEach(([t,a])=>el(t,Object.assign({},a,{fill:'#fff',stroke:GL,'stroke-width':5,'stroke-linejoin':'round'})));
  S.list.forEach(([t,a])=>el(t,Object.assign({},a,{fill:'#fff'})));
  const level=S.by-S.br*0.5; const id='cl'+ox;
  const cp=el('clipPath',{id}); el('rect',{x:0,y:level,width:2000,height:1000},cp);
  const g=el('g',{'clip-path':`url(#${id})`});
  S.list.forEach(([t,a])=>el(t,Object.assign({},a,{fill:LIQ}),g));
  // arm liquid (separate clip: entire arm except gas pocket)
  const id2='ca'+ox; const cp2=el('clipPath',{id:id2}); el('rect',{x:S.ax-3,y:S.atop+(gas||0),width:S.aw+6,height:400},cp2);
  el('path',Object.assign({},S.list[0][1],{fill:LIQ,'clip-path':`url(#${id2})`}));
  if(gas){ line(S.ax+1,S.atop+gas,S.ax+S.aw-1,S.atop+gas,{color:BUB,w:1.2});
    [[S.ax+9,S.atop+gas+30],[S.ax+19,S.atop+gas+62],[S.ax+11,S.atop+gas+100],[S.ax+18,S.atop+gas+140]].forEach(([x,y])=>el('circle',{cx:x,cy:y,r:3.2,fill:'#fff',stroke:BUB,'stroke-width':1}));}
  el("rect",{x:S.bx-10.5,y:S.by-S.br-34,width:21,height:8,fill:"#fff"});
  line(S.bx-S.br*0.87+2,level,S.bx+S.br*0.87-2,level,{color:BUB,w:1.2});
  // stem and foot
  const sx=S.ax-30; el('rect',{x:sx,y:S.abot+20,width:16,height:52,fill:'#fff',stroke:GL,'stroke-width':2.4});
  el('ellipse',{cx:sx+8,cy:S.abot+78,rx:62,ry:9,fill:'#eee',stroke:GL,'stroke-width':2});
  return S;
}
const t1=tube(10,0), t2=tube(330,90);
label(150,377,'Negative: no gas',{fs:17,bold:true}); label(470,377,'Positive: CO_2 gas collects',{fs:17,bold:true,color:RED});
function note(x,y,tx,ty,s,anchor){line(x,y,tx,ty,{color:'#555',w:1.2}); txt(tx+(anchor=='end'?-4:4),ty+5,s,{fs:15,anchor:anchor||'start'});}
note(t1.ax+t1.aw+3,80,t1.ax+t1.aw+24,80,'closed arm:');
txt(t1.ax+t1.aw+28,100,'full of liquid,',{fs:15}); txt(t1.ax+t1.aw+28,118,'no air bubble',{fs:15});
note(t2.ax+t2.aw+3,85,t2.ax+t2.aw+24,85,'CO_2 gas');
note(t1.bx-14,t1.by-t1.br-24,t1.bx-40,t1.by-t1.br-30,'open neck','end');
note(t1.bx-30,t1.by+10,t1.bx-58,t1.by+30,'sugar','end'); txt(t1.bx-62,t1.by+53,'solution',{fs:15,anchor:'end'}); txt(t1.bx-62,t1.by+71,'+ yeast',{fs:15,anchor:'end'});
</script>
