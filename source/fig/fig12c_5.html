<svg id="s" xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" style="background:#fff"></svg>
<style>body{margin:0}</style>
<script src="chem.js"></script>
<script>
init('s',16); const G='#555', PLT='#fbfaf5';
const S=34, Wp=7.5*S, Hp=10*S, y0=70;
function plate(x0,name,lanes,o={}){
 label(x0+Wp/2,26,name,{fs:17,bold:true});
 el('rect',{x:x0,y:y0,width:Wp,height:Hp,fill:PLT,stroke:'#777','stroke-width':1.5});
 const oy=y0+Hp-1.5*S, sy=y0+1*S;
 line(x0,oy,x0+Wp,oy,{w:1.3,color:'#555'}); line(x0,sy,x0+Wp,sy,{w:1.3,color:'#555'});
 label(x0+Wp/2,sy+20,'stop line (pencil)',{fs:14,color:G,italic:true});
 label(x0+Wp/2,oy-14,'origin line (pencil)',{fs:14,color:G,italic:true});
 txt(x0+Wp-8,y0+21,'initials',{fs:13,color:G,anchor:'end',italic:true});
 lanes.forEach((t,i)=>{const x=x0+(1.5+1.5*i)*S; line(x,oy-6,x,oy+6,{w:1.6}); el('circle',{cx:x,cy:oy,r:3.5,fill:'#333'}); label(x,oy+26,t,{fs:15,bold:true});});
 // width
 arrow(x0+Wp/2-34,y0-16,x0,y0-16,{head:8,w:1.2}); arrow(x0+Wp/2+34,y0-16,x0+Wp,y0-16,{head:8,w:1.2}); label(x0+Wp/2,y0-11,'7.5 cm',{fs:15});
 if(o.left){arrow(x0-28,y0+Hp/2-22,x0-28,y0,{head:8,w:1.2}); arrow(x0-28,y0+Hp/2+22,x0-28,y0+Hp,{head:8,w:1.2}); label(x0-28,y0+Hp/2+5,'10 cm',{fs:15});
  // lane spacing below plate
  const yb=y0+Hp+18; [[0,1.5],[1.5,3]].forEach(([a,b])=>{const xa=x0+a*S,xb=x0+b*S; arrow(xa+(xb-xa)/2,yb,xa+2,yb,{head:6,w:1.1}); arrow(xa+(xb-xa)/2,yb,xb-2,yb,{head:6,w:1.1}); label((xa+xb)/2,yb+18,'1.5 cm',{fs:13});});
  line(x0,y0+Hp+4,x0,yb+6,{w:0.8,color:'#888'}); line(x0+1.5*S,oy+30,x0+1.5*S,yb+6,{w:0.8,color:'#888',dash:'3,3'}); line(x0+3*S,oy+30,x0+3*S,yb+6,{w:0.8,color:'#888',dash:'3,3'});}
 if(o.right){const xr=x0+Wp+16;
  arrow(xr,y0+0.5*S,xr,y0+2,{head:6,w:1.1}); arrow(xr,y0+0.5*S,xr,sy-2,{head:6,w:1.1}); txt(xr+7,y0+0.5*S+5,'1 cm',{fs:14});
  arrow(xr,oy+0.75*S,xr,oy+2,{head:6,w:1.1}); arrow(xr,oy+0.75*S,xr,y0+Hp-2,{head:6,w:1.1}); txt(xr+7,oy+0.75*S+5,'1.5 cm',{fs:14});}
}
plate(90,'Plate 1',['Phe','Ala','Glu','Unk'],{left:true});
plate(470,'Plate 2',['Ser','Lys','Asp','Unk'],{right:true});
label(420,488,'Hold plates by the edges, wearing gloves. Use a soft pencil and press lightly.',{fs:15,color:'#b03a2e'});
</script>
