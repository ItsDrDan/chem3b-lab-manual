<svg id="s" xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" style="background:#fff">
<defs><pattern id="cl" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e3e3e3"/><circle cx="2" cy="2" r="1.1" fill="#9a9a9a"/><circle cx="5" cy="5" r="0.9" fill="#b0b0b0"/></pattern></defs>
</svg>
<style>body{margin:0}</style>
<script src="chem.js"></script>
<script>
init('s',20); const RED='#c0392b', GRAY='#555', GL='#8c99a6'; const y=80;
let a=chain(115,y,[{l:'CH_3'},{l:'C',up:{l:'CH_3'},down:{l:'CH_3'}},{l:'OH',color:RED}]);
txt(a.end+14,y+7,'+  HCl');
const ax=a.end+90; arrow(ax,y,ax+130,y); label(ax+65,y-10,'ZnCl_2',{fs:17,bold:true}); label(ax+65,y+24,'25 °C',{fs:15,color:GRAY});
let b=chain(ax+145,y,[{l:'CH_3'},{l:'C',up:{l:'CH_3'},down:{l:'CH_3'}},{l:'Cl',color:RED}]);
txt(b.end+14,y+7,'+  H_2O');
label(a.pos[1].x,158,'t-butyl alcohol (3° alcohol)',{fs:15,bold:true}); label(a.pos[1].x,176,'dissolves in the reagent',{fs:14,color:GRAY});
label(b.pos[1].x,158,'t-butyl chloride (an alkyl chloride)',{fs:15,bold:true}); label(b.pos[1].x,176,'does not dissolve: the mixture turns cloudy',{fs:14,color:GRAY});
line(20,196,880,196,{color:'#bbb',dash:'5,5'});
function tube(cx,kind,l1,l2,l3){const top=230,bot=390,w=34,lq=310;
 const body=(y0,y1,fill)=>{ if(y1>=bot-w/2) el('path',{d:`M${cx-w/2},${y0} L${cx-w/2},${bot-w/2} A${w/2},${w/2} 0 0 0 ${cx+w/2},${bot-w/2} L${cx+w/2},${y0} Z`,fill}); else el('rect',{x:cx-w/2,y:y0,width:w,height:y1-y0,fill});};
 if(kind=='clear') body(lq,bot,'#eaf2f8');
 if(kind=='cloudy') body(lq,bot,'url(#cl)');
 if(kind=='layers'){ body(lq,lq+26,'#f6e7a8'); body(lq+26,bot,'#eaf2f8'); line(cx-w/2,lq+26,cx+w/2,lq+26,{color:'#777',w:1.4}); }
 el('path',{d:`M${cx-w/2},${top} L${cx-w/2},${bot-w/2} A${w/2},${w/2} 0 0 0 ${cx+w/2},${bot-w/2} L${cx+w/2},${top}`,fill:'none',stroke:GL,'stroke-width':2.5});
 el('ellipse',{cx,cy:top,rx:w/2+3,ry:4,fill:'none',stroke:GL,'stroke-width':2});
 label(cx,418,l1,{fs:16,bold:true}); label(cx,438,l2,{fs:14,color:GRAY}); label(cx,457,l3,{fs:14,color:GRAY});}
tube(150,'clear','1° alcohol','stays clear','no change at room temperature');
tube(450,'cloudy','2° alcohol','turns cloudy','in about 3–10 minutes');
tube(750,'layers','3° alcohol','cloudy, then two layers','almost at once (under 1 minute)');
txt(770,322,'← alkyl chloride layer',{fs:13,color:GRAY});
</script>
