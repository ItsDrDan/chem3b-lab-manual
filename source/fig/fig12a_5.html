<svg id="s" xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" style="background:#fff"></svg>
<style>body{margin:0}</style>
<script src="chem.js"></script>
<script>
init('s',16); const G='#555', PAP='#fbfaf5', B='#1f5fbf';
const S=28, x0=70, y0=50, W=24*S, H=12*S;
el('rect',{x:x0,y:y0,width:W,height:H,fill:PAP,stroke:'#777','stroke-width':1.5});
const oy=y0+H-2*S;
line(x0,oy,x0+W,oy,{w:1.3,color:'#555'});
['Phe','Ala','Glu','Ser','Lys','Asp','Unk'].forEach((t,i)=>{const x=x0+(i+1)*3*S; line(x,oy-6,x,oy+6,{w:1.6}); el('circle',{cx:x,cy:oy,r:3.5,fill:'#333'}); label(x,oy+26,t,{fs:15,bold:true});});
// dimensions
arrow(x0+W/2-40,y0-22,x0,y0-22,{head:8,w:1.2}); arrow(x0+W/2+40,y0-22,x0+W,y0-22,{head:8,w:1.2}); label(x0+W/2,y0-17,'24 cm',{fs:15});
arrow(x0-28,y0+H/2-22,x0-28,y0,{head:8,w:1.2}); arrow(x0-28,y0+H/2+22,x0-28,y0+H,{head:8,w:1.2}); label(x0-28,y0+H/2+5,'12 cm',{fs:15});
arrow(x0+W+16,oy+(y0+H-oy)/2,x0+W+16,oy,{head:7,w:1.2}); arrow(x0+W+16,oy+(y0+H-oy)/2,x0+W+16,y0+H,{head:7,w:1.2}); txt(x0+W+22,oy+(y0+H-oy)/2+5,'2 cm',{fs:15});
arrow(x0+3*S+3,oy-22,x0+6*S-3,oy-22,{head:6,w:1.1}); arrow(x0+6*S-3,oy-22,x0+3*S+3,oy-22,{head:6,w:1.1}); label(x0+4.5*S,oy-30,'3 cm',{fs:14});
arrow(x0+3,oy-22,x0+3*S-3,oy-22,{head:6,w:1.1}); arrow(x0+3*S-3,oy-22,x0+3,oy-22,{head:6,w:1.1}); label(x0+1.5*S,oy-30,'3 cm',{fs:14});
txt(x0+W-10,y0+24,'initials (pencil)',{fs:15,color:G,anchor:'end',italic:true});
label(x0+W/2,oy-60,'pencil line (origin) 2 cm from the long edge; 7 marks 3 cm apart',{fs:15,color:G});
label(x0+W/2,y0+H+40,'Handle the paper only by its edges, wearing gloves. Use pencil, never ink.',{fs:15,color:'#b03a2e'});
</script>
