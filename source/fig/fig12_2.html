<svg id="s" xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" style="background:#fff"></svg>
<style>body{margin:0}</style>
<script src="chem.js"></script>
<script>
init('s',17); const GRAY='#555', IOD='#8a4b12', GL='#9aa7b4';
// ring stand
el('rect',{x:40,y:560,width:260,height:16,fill:'#333',rx:2});
el('rect',{x:70,y:40,width:10,height:522,fill:'#666'});
// clamp
el('rect',{x:80,y:173,width:95,height:8,fill:'#444'}); el('rect',{x:168,y:165,width:26,height:24,rx:4,fill:'none',stroke:'#444','stroke-width':3});
// buret
const bx=170,bw=22,btop=60,liq=78,bot=430;
el('rect',{x:bx,y:btop,width:bw,height:bot-btop,fill:'#fff',stroke:GL,'stroke-width':2});
el('rect',{x:bx+2,y:liq,width:bw-4,height:bot-liq,fill:IOD,opacity:0.85});
for(let i=0;i<=25;i++){const y=liq+i*13.2; line(bx,y,bx+(i%5==0?11:6),y,{w:1,color:'#fff'}); if(i%5==0) txt(bx-6,y+5,String(i),{fs:11,anchor:'end',color:GRAY});}
// stopcock and tip
el('rect',{x:bx+4,y:bot,width:bw-8,height:22,fill:IOD,stroke:GL});
el('rect',{x:bx-16,y:bot+6,width:bw+32,height:10,rx:3,fill:'#2b6cb0'});
el('polygon',{points:`${bx+6},${bot+22} ${bx+bw-6},${bot+22} ${bx+bw/2+2},${bot+52} ${bx+bw/2-2},${bot+52}`,fill:IOD,stroke:GL});
el('ellipse',{cx:bx+bw/2,cy:bot+64,rx:3,ry:5,fill:IOD});
// flask
const fx=bx+bw/2, fy=560;
const fl=`M${fx-14},${bot+40} L${fx-14},${bot+70} L${fx-70},${fy-2} L${fx+70},${fy-2} L${fx+14},${bot+70} L${fx+14},${bot+40}`;
el('path',{d:`M${fx-44},${fy-28} L${fx-68},${fy-3} L${fx+68},${fy-3} L${fx+44},${fy-28} Z`,fill:'#f4d58d',opacity:0.8});
el('path',{d:fl,fill:'none',stroke:GL,'stroke-width':2.5});
el('rect',{x:fx-95,y:fy-2,width:190,height:4,fill:'#fff',stroke:'#bbb'});
// callouts
function call(x1,y1,x2,y2,lines){line(x1,y1,x2,y2,{w:1.2,color:'#333'}); lines.forEach((t,i)=>txt(x2+6,y2+5+i*19,t,{fs:15,bold:i==0,color:i==0?'#000':GRAY}));}
call(bx+bw,120,300,110,['One buret of iodine for every titration','Do not drain it until all titrations are done.']);
call(bx+bw,liq,300,58,['Read to two decimal places (0.01 mL)']);
call(bx+bw+16,bot+11,300,330,['Stopcock','Add iodine drop by drop near the endpoint.']);
call(fx+45,fy-20,300,470,['250-mL Erlenmeyer flask','sample + water + acetic acid + starch','Swirl the flask the whole time.']);
call(fx+95,fy,300,560,['White paper under the flask','makes the color change easy to see']);
// endpoint inset
const ix=620,iy=150;
el('rect',{x:ix-10,y:iy-40,width:280,height:300,rx:10,fill:'#fafafa',stroke:'#ccc'});
txt(ix+130,iy-12,'Finding the endpoint',{fs:16,bold:true,anchor:'middle'});
function flask(cx,cy,fill,lab1,lab2){el('path',{d:`M${cx-40},${cy+70} L${cx+40},${cy+70} L${cx+10},${cy+10} L${cx+10},${cy-30} L${cx-10},${cy-30} L${cx-10},${cy+10} Z`,fill:'none',stroke:GL,'stroke-width':2});
 el('path',{d:`M${cx-30},${cy+50} L${cx+30},${cy+50} L${cx+40},${cy+70} L${cx-40},${cy+70} Z`,fill}); label(cx,cy+95,lab1,{fs:14,bold:true}); label(cx,cy+113,lab2,{fs:13,color:GRAY});}
flask(ix+60,iy+40,'#f4d58d','Before','sample color');
flask(ix+200,iy+40,'#1d2b64','Endpoint','blue-black');
arrow(ix+108,iy+90,ix+150,iy+90,{head:9});
['Iodine is used up as long as vitamin C','is left, so no blue color forms. The','endpoint is the FIRST blue color that','stays for 20 seconds while swirling.'].forEach((t,i)=>txt(ix+3,iy+180+i*18,t,{fs:13.5}));
</script>
